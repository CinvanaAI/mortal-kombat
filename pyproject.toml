[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-tournament-engine"
version = "0.2.0"
description = "Mortal Kombat: task evaluation, model tournaments, and inspectable evidence."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE.md"}

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mortal-kombat = "prompt_tournament.workflow_cli:main"
prompt-tournament-demo = "prompt_tournament.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prompt_tournament = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
